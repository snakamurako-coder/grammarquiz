<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>DigitalDrill（デジドリ）管理</title>
  <style>
:root { --c-primary:#2196f3; --c-primary-dark:#1976d2; --c-success:#4caf50; --c-text:#333; --c-text-sub:#666; --c-bg:#f4f7f6; --radius:12px; --shadow:0 2px 8px rgba(0,0,0,0.06); }
*,*::before,*::after{box-sizing:border-box}
body{font-family:'Helvetica Neue','Hiragino Kaku Gothic ProN','Noto Sans JP',Arial,sans-serif;background:var(--c-bg);color:var(--c-text);line-height:1.55;margin:0 auto;max-width:800px;padding:12px 12px 40px}
.header-title{font-size:clamp(1.3em,5vw,1.8em);font-weight:bold;color:#2c3e50;text-align:center;margin:4px 0 16px}
.setting-section{background:#fff;padding:16px;border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px}
.section-title{font-size:1.05em;font-weight:bold;color:#455a64;margin-bottom:12px;border-bottom:2px solid #eceff1;padding-bottom:6px}
.btn-primary{width:100%;min-height:48px;padding:12px;font-size:1em;font-weight:bold;background:var(--c-primary);color:#fff;border:none;border-radius:10px;cursor:pointer;margin-top:8px}
.btn-small{min-height:38px;padding:8px 14px;font-size:.85em;background:#607d8b;color:#fff;border:none;border-radius:8px;cursor:pointer}
.alert-box{padding:12px;border-radius:8px;margin-bottom:16px;font-weight:bold}
.alert-success{background:#e8f5e9;color:#2e7d32}
.alert-error{background:#ffebee;color:#c62828}
.log-item{padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:.9em}
.log-item:last-child{border-bottom:none}
table{width:100%;border-collapse:collapse;font-size:.85em}
th,td{border:1px solid #ddd;padding:6px 8px;text-align:left}
th{background:#f5f5f5}
  </style>
</head>
<body>
  <div class="header-title">DigitalDrill 管理者ダッシュボード</div>
  <p style="text-align:center;font-size:.9em;margin:-8px 0 12px;">
    <a id="pages-link" href="#">学習画面（GitHub Pages）を開く</a>
  </p>
  <div id="status-banner" style="display:none;" class="alert-box"></div>

  <div class="setting-section">
    <div class="section-title">セッション集約（直近100件）</div>
    <p style="font-size:.85em;color:#666;">プリセット学習の概要は Google フォーム回答先スプレッドシートに即時反映されます。本体 SS は制限付き共有にしてください。</p>
    <button type="button" id="refresh-summaries-btn" class="btn-small">再読込</button>
    <div id="summaries-wrap" style="overflow-x:auto;margin-top:12px;">読込中...</div>
  </div>

  <div class="setting-section">
    <div class="section-title">ホワイトリスト</div>
    <p style="font-size:.85em;color:#666;">本体スプレッドシートの whitelist シートを編集してください（ここは閲覧のみ）。</p>
    <div id="whitelist-wrap" style="overflow-x:auto;margin-top:8px;">読込中...</div>
  </div>

<script>
const PAGES_URL = '<?= PAGES_URL ?>';

function gasRun(fnName) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function(resolve, reject) {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(function(err) {
        reject(new Error(typeof err === 'object' && err.message ? err.message : String(err)));
      })[fnName].apply(google.script.run, args);
  });
}

function showBanner(text, ok) {
  var el = document.getElementById('status-banner');
  el.textContent = text;
  el.className = 'alert-box ' + (ok ? 'alert-success' : 'alert-error');
  el.style.display = 'block';
}

async function loadSummaries() {
  var wrap = document.getElementById('summaries-wrap');
  try {
    var result = await gasRun('apiAdminGetSessionSummaries', 100);
    if (result.status !== 'success') throw new Error(result.message);
    var logs = result.data || [];
    if (logs.length === 0) {
      wrap.innerHTML = '<p>まだ集約データがありません。</p>';
      return;
    }
    var html = '<table><thead><tr>';
    html += '<th>日時</th><th>ユーザー</th><th>モード</th><th>セット</th><th>回数</th><th>スコア</th></tr></thead><tbody>';
    logs.forEach(function (log) {
      html += '<tr><td>' + (log.Ended_At || log.Started_At || '') + '</td>';
      html += '<td>' + (log.User_ID || '') + '</td>';
      html += '<td>' + (log.Mode || '') + '</td>';
      html += '<td>' + (log.Set_Name || '') + '</td>';
      html += '<td>' + (log.Attempt_No || '') + '</td>';
      html += '<td>' + (log.Score != null ? log.Score + '%' : '') + '</td></tr>';
    });
    html += '</tbody></table>';
    wrap.innerHTML = html;
  } catch (e) {
    wrap.innerHTML = '<p style="color:#c62828;">エラー: ' + e.message + '</p>';
  }
}

async function loadWhitelist() {
  var wrap = document.getElementById('whitelist-wrap');
  try {
    var result = await gasRun('apiAdminGetWhitelist');
    if (result.status !== 'success') throw new Error(result.message);
    var rows = result.data || [];
    if (rows.length === 0) {
      wrap.innerHTML = '<p>登録ユーザーがありません。</p>';
      return;
    }
    var html = '<table><thead><tr><th>account</th><th>name</th><th>grade</th><th>class</th></tr></thead><tbody>';
    rows.forEach(function (r) {
      html += '<tr><td>' + (r.account || '') + '</td><td>' + (r.name || '') + '</td>';
      html += '<td>' + (r.grade || '') + '</td><td>' + (r.class || '') + '</td></tr>';
    });
    html += '</tbody></table>';
    wrap.innerHTML = html;
  } catch (e) {
    wrap.innerHTML = '<p style="color:#c62828;">' + e.message + '</p>';
  }
}

document.addEventListener('DOMContentLoaded', function() {
  var pagesLink = document.getElementById('pages-link');
  if (pagesLink && PAGES_URL) pagesLink.href = PAGES_URL;

  loadSummaries();
  loadWhitelist();

  document.getElementById('refresh-summaries-btn').addEventListener('click', loadSummaries);
});
</script>
</body>
</html>
