<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>DigitalDrill（デジドリ）</title>
  <style>
:root { --c-primary:#2196f3; --c-primary-dark:#1976d2; --c-success:#4caf50; --c-text:#333; --c-text-sub:#666; --c-bg:#f4f7f6; --radius:12px; --shadow:0 2px 8px rgba(0,0,0,0.06); --tap:48px; }
*,*::before,*::after{box-sizing:border-box}
body{font-family:'Helvetica Neue','Hiragino Kaku Gothic ProN','Noto Sans JP',Arial,sans-serif;background:var(--c-bg);color:var(--c-text);line-height:1.55;margin:0 auto;max-width:640px;padding:12px 12px 40px}
.header-title{font-size:clamp(1.3em,5vw,1.8em);font-weight:bold;color:#2c3e50;text-align:center;margin:4px 0 16px}
.setting-section{background:#fff;padding:16px;border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px}
.section-title{font-size:1.05em;font-weight:bold;color:#455a64;margin-bottom:12px;border-bottom:2px solid #eceff1;padding-bottom:6px}
.form-group{margin-bottom:15px}
label{display:block;margin-bottom:5px;font-weight:bold;font-size:.9em;color:var(--c-text-sub)}
select,input,textarea{width:100%;padding:10px 12px;border:1px solid #ccc;border-radius:8px;font-size:16px;font-family:inherit;background:#f9f9f9}
textarea{min-height:60px;resize:vertical}
.btn-primary{width:100%;min-height:54px;padding:14px;font-size:1.05em;font-weight:bold;background:var(--c-primary);color:#fff;border:none;border-radius:10px;cursor:pointer}
.btn-primary:disabled{background:#b0bec5}
.btn-small{min-height:38px;padding:8px 14px;font-size:.85em;background:#607d8b;color:#fff;border:none;border-radius:8px;cursor:pointer}
.mode-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.mode-tab{flex:1;min-width:90px;min-height:44px;padding:10px;border:2px solid #cfd8dc;border-radius:10px;background:#fff;font-weight:bold;cursor:pointer;font-size:.85em}
.mode-tab.active{background:#e3f2fd;border-color:var(--c-primary);color:var(--c-primary-dark)}
.vocab-form-grid{display:grid;grid-template-columns:1fr;gap:12px}
.vocab-preview-table{width:100%;border-collapse:collapse;font-size:.75em;margin-top:10px}
.vocab-preview-table th,.vocab-preview-table td{border:1px solid #ddd;padding:4px 6px;word-break:break-word}
.vocab-preview-table th{background:#f5f5f5}
.log-item{padding:10px 0;border-bottom:1px solid #f5f5f5;font-size:.92em}
.log-item:last-child{border-bottom:none}
.alert-box{padding:12px;border-radius:8px;margin-bottom:16px;font-weight:bold}
.alert-success{background:#e8f5e9;color:#2e7d32}
.alert-error{background:#ffebee;color:#c62828}
  </style>
</head>
<body>
  <div class="header-title">DigitalDrill（デジドリ） ダッシュボード</div>
  <p style="text-align:center;font-size:.9em;margin:-8px 0 12px;">
    <a id="pages-link" href="<?= AUTH_URL ?>" target="_top" rel="noopener">GitHub Pages 学習画面を開く（要認証）</a>
  </p>
  <div id="status-banner" style="display:none;" class="alert-box"></div>

  <div class="mode-tabs">
    <button type="button" class="mode-tab active" data-tab="sets">マイセット</button>
    <button type="button" class="mode-tab" data-tab="register">単語登録</button>
    <button type="button" class="mode-tab" data-tab="logs">学習記録</button>
  </div>

  <div id="tab-sets">
    <div class="setting-section">
      <div class="section-title">マイ単語帳（あなたのDrive）</div>
      <div id="set-list">読込中...</div>
    </div>
    <div class="setting-section">
      <div class="section-title">学習スタート</div>
      <div class="form-group">
        <label>教材（シート）</label>
        <select id="start-sheet-select"></select>
      </div>
      <div class="form-group">
        <label>学習モード</label>
        <select id="start-mode">
          <option value="reading">音読練習（プレースホルダ）</option>
          <option value="vocab">単語学習（N択・GitHub Pages）</option>
        </select>
      </div>
      <button type="button" id="start-learning-btn" class="btn-primary">学習スタート（GitHub Pagesへ）</button>
      <p style="font-size:.85em;color:#666;margin-top:8px;">データはCacheServiceに一時保存され、トークン付きで学習画面に引き渡されます。</p>
    </div>
  </div>

  <div id="tab-register" style="display:none;">
    <div class="setting-section">
      <div class="section-title">単語登録（マイ単語帳）</div>
      <div class="form-group">
        <label>登録先シート（教材名）</label>
        <input type="text" id="register-sheet-name" value="デフォルト">
      </div>
      <div class="form-group">
        <label>TSV貼り付け（22列・ヘッダなし）</label>
        <textarea id="register-tsv-input" rows="4"></textarea>
        <button type="button" id="register-parse-tsv-btn" class="btn-small" style="margin-top:8px;">TSVを解析</button>
      </div>
      <div id="register-preview-area" style="display:none;">
        <div id="register-preview-table-wrap" style="overflow-x:auto;"></div>
        <button type="button" id="register-import-btn" class="btn-primary" style="margin-top:12px;">一括登録</button>
      </div>
      <div id="register-msg" style="margin-top:10px;font-weight:bold;"></div>
    </div>
    <div class="setting-section">
      <div class="section-title">手動入力（1語）</div>
      <div class="vocab-form-grid" id="register-form-grid"></div>
      <button type="button" id="register-single-btn" class="btn-primary" style="margin-top:12px;">登録</button>
    </div>
  </div>

  <div id="tab-logs" style="display:none;">
    <div class="setting-section">
      <div class="section-title">学習記録（直近20件）</div>
      <div id="logs-list">読込中...</div>
    </div>
  </div>

<script>
const VOCAB_UNREGISTERED = '(未登録)';
const VOCAB_REGISTER_FIELDS = [
  '大区分','中区分','小区分','英単語・熟語の表現',
  '意味＠名詞','意味＠動詞','意味＠形容詞','意味＠副詞','意味＠前置詞',
  '意味＠接続詞','意味＠その他品詞','意味＠熟語・慣用表現',
  'メモ','類義語・同義語','対義語','派生語・関連語',
  '英文による定義','チャンク','チャンク訳','例文','例文訳'
];
const PAGES_URL = '<?= PAGES_URL ?>';
const RESULT_TOKEN = '<?= RESULT_TOKEN ?>';
const AUTH_URL = '<?= AUTH_URL ?>';

function gasRun(fnName) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function(resolve, reject) {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(function(err) {
        reject(new Error(typeof err === 'object' && err.message ? err.message : String(err)));
      })[fnName].apply(google.script.run, args);
  });
}

function vocabNorm(v) {
  if (v == null) return VOCAB_UNREGISTERED;
  var s = v.toString().trim();
  return s === '' ? VOCAB_UNREGISTERED : s;
}

function showBanner(text, ok) {
  var el = document.getElementById('status-banner');
  el.textContent = text;
  el.className = 'alert-box ' + (ok ? 'alert-success' : 'alert-error');
  el.style.display = 'block';
}

function initTabs() {
  document.querySelectorAll('.mode-tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      document.querySelectorAll('.mode-tab').forEach(function(t) { t.classList.remove('active'); });
      tab.classList.add('active');
      var name = tab.dataset.tab;
      document.getElementById('tab-sets').style.display = name === 'sets' ? 'block' : 'none';
      document.getElementById('tab-register').style.display = name === 'register' ? 'block' : 'none';
      document.getElementById('tab-logs').style.display = name === 'logs' ? 'block' : 'none';
    });
  });
}

function buildRegisterForm() {
  var grid = document.getElementById('register-form-grid');
  VOCAB_REGISTER_FIELDS.forEach(function(field) {
    var wrap = document.createElement('div');
    wrap.className = 'form-group';
    var lbl = document.createElement('label');
    lbl.textContent = field;
    wrap.appendChild(lbl);
    var isLong = field.indexOf('訳') >= 0 || field === 'メモ' || field.indexOf('例文') >= 0 || field.indexOf('チャンク') >= 0;
    var input = document.createElement(isLong ? 'textarea' : 'input');
    input.dataset.field = field;
    wrap.appendChild(input);
    grid.appendChild(wrap);
  });
}

function readFormRow() {
  var row = {};
  VOCAB_REGISTER_FIELDS.forEach(function(field) {
    var el = document.querySelector('#register-form-grid [data-field="' + field + '"]');
    row[field] = el ? el.value : '';
  });
  return row;
}

function parseTsv(text) {
  var lines = text.split(/\r?\n/).filter(function(l) { return l.trim(); });
  var rows = [];
  lines.forEach(function(line) {
    var cols = line.split('\t');
    if (cols.length < 4) return;
    var row = {};
    if (cols.length >= 22 && !isNaN(parseInt(cols[0], 10))) {
      VOCAB_REGISTER_FIELDS.forEach(function(field, i) { row[field] = cols[i + 1] || ''; });
    } else if (cols.length >= 21) {
      VOCAB_REGISTER_FIELDS.forEach(function(field, i) { row[field] = cols[i] || ''; });
    } else {
      row['大区分'] = cols[0] || '';
      row['中区分'] = cols[1] || '';
      row['小区分'] = cols[2] || '';
      row['英単語・熟語の表現'] = cols[3] || '';
      VOCAB_REGISTER_FIELDS.slice(4).forEach(function(field, i) { row[field] = cols[i + 4] || ''; });
    }
    rows.push(row);
  });
  return rows;
}

var previewRows = [];

async function loadSets() {
  var el = document.getElementById('set-list');
  var select = document.getElementById('start-sheet-select');
  try {
    var result = await gasRun('apiUserGetVocabCatalog');
    if (result.status !== 'success') throw new Error(result.message);
    var books = result.data.userBooks || [];
    if (books.length === 0) {
      el.innerHTML = '<p>マイ単語帳がありません。初回アクセス時に自動作成されます。</p>';
      return;
    }
    var html = '';
    select.innerHTML = '';
    books[0].sheets.forEach(function(s) {
      html += '<div class="log-item"><strong>' + s.sheetName + '</strong> — ' + s.wordCount + '語</div>';
      var opt = document.createElement('option');
      opt.value = s.sheetName;
      opt.textContent = s.sheetName + ' (' + s.wordCount + '語)';
      select.appendChild(opt);
    });
    el.innerHTML = html;
  } catch (e) {
    el.innerHTML = '<p style="color:#c62828;">エラー: ' + e.message + '</p>';
  }
}

async function loadLogs() {
  var el = document.getElementById('logs-list');
  try {
    var result = await gasRun('apiUserGetLearningLogs');
    if (result.status !== 'success') throw new Error(result.message);
    var logs = result.data || [];
    if (logs.length === 0) {
      el.innerHTML = '<p>まだ記録がありません。</p>';
      return;
    }
    var html = '';
    logs.forEach(function(log) {
      html += '<div class="log-item"><strong>' + (log['学習セット名'] || '') + '</strong><br>';
      html += '<span style="font-size:.85em;color:#888;">' + (log['タイムスタンプ'] || '') + ' / ' + (log['モード'] || '') + ' / ' + (log['正答率'] || '') + '%</span></div>';
    });
    el.innerHTML = html;
  } catch (e) {
    el.innerHTML = '<p style="color:#c62828;">エラー: ' + e.message + '</p>';
  }
}

async function startLearning() {
  var btn = document.getElementById('start-learning-btn');
  var sheetName = document.getElementById('start-sheet-select').value;
  var mode = document.getElementById('start-mode').value;
  if (!sheetName) { alert('シートを選択してください'); return; }
  btn.disabled = true;
  btn.textContent = 'セッション作成中...';
  try {
    var payload = JSON.stringify({ mode: mode, sheetName: sheetName, filters: {}, options: { choiceCount: 4, questionCount: 'all', includeUnknown: true, includeNone: true, dummyScope: 'sheet', dummyMethod: 'none' } });
    var result = await gasRun('apiStartSession', payload);
    if (result.status !== 'success') throw new Error(result.message);
    var pagesUrl = result.pagesUrl || PAGES_URL;
    var sep = pagesUrl.indexOf('?') >= 0 ? '&' : '?';
    var dest = pagesUrl + sep;
    if (result.authToken) {
      dest += 'auth=' + encodeURIComponent(result.authToken) + '&';
    }
    dest += 'token=' + encodeURIComponent(result.token) + '&mode=' + encodeURIComponent(mode);
    window.top.location.href = dest;
  } catch (e) {
    alert('エラー: ' + e.message);
    btn.disabled = false;
    btn.textContent = '学習スタート（GitHub Pagesへ）';
  }
}

async function saveResultFromToken(token) {
  if (!token) return;
  try {
    var result = await gasRun('apiSaveSessionResult', token);
    if (result.status === 'success') {
      showBanner('学習結果を保存しました（正答率: ' + (result.data.score || result.data.correctRate || '-') + '%）', true);
      loadLogs();
    } else {
      showBanner('結果保存エラー: ' + result.message, false);
    }
  } catch (e) {
    showBanner('結果保存エラー: ' + e.message, false);
  }
}

document.addEventListener('DOMContentLoaded', function() {
  initTabs();
  buildRegisterForm();
  loadSets();
  loadLogs();

  var pagesLink = document.getElementById('pages-link');
  if (pagesLink && AUTH_URL) {
    pagesLink.href = AUTH_URL;
    pagesLink.target = '_top';
  }

  document.getElementById('start-learning-btn').addEventListener('click', startLearning);

  document.getElementById('register-parse-tsv-btn').addEventListener('click', function() {
    previewRows = parseTsv(document.getElementById('register-tsv-input').value);
    if (previewRows.length === 0) { document.getElementById('register-msg').textContent = '有効な行がありません'; return; }
    document.getElementById('register-preview-area').style.display = 'block';
    document.getElementById('register-msg').textContent = previewRows.length + '語をプレビュー';
  });

  document.getElementById('register-import-btn').addEventListener('click', async function() {
    var sheetName = document.getElementById('register-sheet-name').value.trim() || 'デフォルト';
    try {
      var result = await gasRun('apiUserRegisterVocabWords', sheetName, JSON.stringify(previewRows));
      if (result.status !== 'success') throw new Error(result.message);
      document.getElementById('register-msg').textContent = result.data.registeredCount + '語を登録しました';
      loadSets();
    } catch (e) {
      document.getElementById('register-msg').textContent = 'エラー: ' + e.message;
    }
  });

  document.getElementById('register-single-btn').addEventListener('click', async function() {
    var sheetName = document.getElementById('register-sheet-name').value.trim() || 'デフォルト';
    try {
      var result = await gasRun('apiUserRegisterVocabWords', sheetName, JSON.stringify([readFormRow()]));
      if (result.status !== 'success') throw new Error(result.message);
      document.getElementById('register-msg').textContent = '登録しました';
      loadSets();
    } catch (e) {
      document.getElementById('register-msg').textContent = 'エラー: ' + e.message;
    }
  });

  if (RESULT_TOKEN) saveResultFromToken(RESULT_TOKEN);
});
</script>
</body>
</html>
